<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>NEON DASH — Kairos Mobile</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#menu{position:absolute;inset:0;background:linear-gradient(160deg,#09131fe8,#050d18c9);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px;gap:14px}h1{font-size:clamp(34px,10vw,58px);letter-spacing:3px;margin:0;text-shadow:0 0 24px #0bc5ff}p{line-height:1.55;max-width:330px;color:#c9dfeb;margin:0}button{background:linear-gradient(90deg,#08d3ff,#3376ff);border:0;border-radius:12px;padding:15px 30px;color:#04111c;font-weight:900;font-size:18px;box-shadow:0 0 28px #0af6ff60}#controls{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;display:none;justify-content:space-around;pointer-events:none}#controls button{pointer-events:auto;padding:13px 17px;min-width:61px;opacity:.8;font-size:22px}#pause{position:absolute;right:12px;top:max(15px,env(safe-area-inset-top));display:none;padding:8px 13px;font-size:18px}small{color:#8ec9dd}</style></head><body><canvas id="c"></canvas><button id="pause">Ⅱ</button><div id="controls"><button data-action="left">◀</button><button data-action="jump">↑</button><button data-action="slide">↓</button><button data-action="right">▶</button></div><div id="menu"><h1>NEON DASH</h1><p id="desc">KAIROS ESCAPE<br>Race through five changing city districts. Dodge barriers, jump crates, slide under beams and collect energy tokens.</p><button id="start">START RUN</button><small>Swipe left/right to change lanes · Up to jump · Down to slide</small></div><script>
(()=>{'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),desc=document.getElementById('desc'),start=document.getElementById('start'),controls=document.getElementById('controls'),pauseBtn=document.getElementById('pause');let W=0,H=0,DPR=1,playing=false,paused=false,dead=false,last=0,dist=0,score=0,coins=0,speed=15,lane=1,laneVisual=1,jump=0,slide=0,obstacles=[],particles=[],spawn=0,shake=0,clock=0,zone=0,roadOffset=0;const names=['OLD CITY','DOWNTOWN','CONSTRUCTION','INDUSTRIAL','MEGACITY'],palettes=[['#aab5b6','#6a7179','#333e4c'],['#b4bdc9','#5a738d','#2a394c'],['#cbb6a0','#947a67','#4c4a49'],['#c5aaa0','#806f6a','#3b4449'],['#a0adbf','#667c97','#202d46']];function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();function rnd(n){let v=Math.sin(n*127.1+24.7)*43758.5453;return v-Math.floor(v)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function move(a){if(!playing||paused)return;if(a==='left')lane=Math.max(0,lane-1);if(a==='right')lane=Math.min(2,lane+1);if(a==='jump'&&jump<=0&&slide<=0)jump=.84;if(a==='slide'&&jump<=0)slide=.73}let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{sx=e.changedTouches[0].clientX;sy=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy<0?'jump':'slide')},{passive:true});addEventListener('keydown',e=>{const a={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',ArrowDown:'slide',a:'left',d:'right',w:'jump',s:'slide'}[e.key];if(a){e.preventDefault();move(a)}if(e.key==='Escape')togglePause()});controls.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.action)}));function togglePause(){if(!playing)return;paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ'}pauseBtn.onclick=togglePause;function reset(){playing=true;paused=false;dead=false;last=0;dist=0;score=0;coins=0;speed=15;lane=1;laneVisual=1;jump=0;slide=0;obstacles=[];particles=[];spawn=0;shake=0;clock=0;zone=0;roadOffset=0;menu.style.display='none';controls.style.display='flex';pauseBtn.style.display='block';pauseBtn.textContent='Ⅱ'}start.onclick=reset;function project(z,l=0){let t=clamp(z/85,0,1),horizon=H*.38,depth=Math.pow(1-t,1.55),y=horizon+(H*.97-horizon)*depth,half=W*(.06+.59*depth);return{x:W/2+l*half/1.5,y,half,scale:.14+1.65*depth,depth}}function poly(points,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}function line(x,y,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke()}function glow(x,y,r,c){let g=ctx.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'#00bfff00');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r)}function sky(){let p=palettes[zone],g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,zone===4?'#19243e':'#77879a');g.addColorStop(.39,zone===2?'#e2b8a0':'#b8a9a4');g.addColorStop(1,'#18232e');rect(0,0,W,H,g);let sunX=W*.78,sunY=H*.27;glow(sunX,sunY,W*.45,'#ffb97c77');ctx.fillStyle='#f5d4a4';ctx.beginPath();ctx.arc(sunX,sunY,Math.max(16,W*.052),0,7);ctx.fill();for(let layer=0;layer<3;layer++){let n=18,base=H*(.34+layer*.025),step=W/n;for(let i=-2;i<n+2;i++){let seed=i+layer*83+zone*43,h=H*(.08+rnd(seed)*(.12+layer*.09)),bw=step*(.8+rnd(seed+5)*1.2),x=i*step+(dist*(.003+layer*.004)%step);rect(x,base-h,bw,h,p[2-layer===-1?0:Math.min(2,layer)]);if(layer===2){for(let wx=x+5;wx<x+bw-3;wx+=9)for(let wy=base-h+10;wy<base-5;wy+=13)if(rnd(wx*3+wy)> .43)rect(wx,wy,2,3,zone===4?'#55c9e7aa':'#d2d8d088')}}}let fog=ctx.createLinearGradient(0,H*.3,0,H*.52);fog.addColorStop(0,'#bec4c300');fog.addColorStop(1,'#d7c8b344');rect(0,H*.3,W,H*.22,fog)}function building(side,z,seed){let p=project(z),scale=p.scale,x=W/2+side*(p.half+20*scale),w=(35+rnd(seed)*75)*scale,h=(100+rnd(seed+3)*220)*scale,y=p.y;let color=['#34414c','#47515b','#56616b','#333c45'][Math.floor(rnd(seed+4)*4)];rect(x+(side<0?-w:0),y-h,w,h,color);let bx=x+(side<0?-w:0);rect(bx,y-h,w,5*scale,'#222c34');for(let xx=bx+8*scale;xx<bx+w-5*scale;xx+=15*scale)for(let yy=y-h+14*scale;yy<y-9*scale;yy+=18*scale){rect(xx,yy,6*scale,9*scale,rnd(xx+yy+seed)>.56?'#d1b99b':'#6f8792')}if(zone===2){line(bx+w*.2,y-h-35*scale,bx+w*.2,y-h,'#283641',2*scale);line(bx+w*.2,y-h-35*scale,bx+w*1.7,y-h-35*scale,'#283641',2*scale)}if(zone>=3){rect(bx+w*.25,y-h-25*scale,9*scale,25*scale,'#5d6166');rect(bx+w*.65,y-h-16*scale,12*scale,16*scale,'#676d6d')}}function drawWorld(){sky();let far=project(85),near=project(0);poly([[W/2-far.half,far.y],[W/2+far.half,far.y],[W/2+near.half,near.y],[W/2-near.half,near.y]],'#222b34');for(let z=85;z>=0;z-=7){let p=project(z),q=project(Math.max(0,z-7));for(let side of [-1,1]){let seed=Math.floor((dist+z)/19)+side*127;let x=W/2+side*(p.half+14*p.scale),y=p.y;rect(x+(side<0?-25*p.scale:0),y-2*p.scale,25*p.scale,5*p.scale,'#56616a');if(z%14===0)building(side,z,seed)}}for(let z=80;z>=0;z-=5){let p=project((z+roadOffset)%85),w=p.half;let stripeWidth=Math.max(1,p.scale*2);for(let divider of [-1/3,1/3]){let x=W/2+divider*w;rect(x-stripeWidth/2,p.y, stripeWidth,Math.max(2,p.scale*8),'#a3bac0aa')}for(let edge of [-1,1]){let x=W/2+edge*w*.93;rect(x,p.y,Math.max(1,p.scale*2),Math.max(3,p.scale*13),'#24cfff');glow(x,p.y,Math.max(3,p.scale*10),'#00bfff77')}if(z%10===0){line(W/2-w*.9,p.y,W/2+w*.9,p.y,'#71818a33',Math.max(1,p.scale))}}}function obstacle(o){let p=project(o.z,o.lane-1),s=p.scale,ground=p.y,x=p.x;ctx.save();ctx.translate(x,ground);if(o.type==='coin'){glow(0,-30*s,18*s,'#ffdf4b88');ctx.fillStyle='#ffd957';ctx.beginPath();ctx.ellipse(0,-30*s,8*s,12*s,0,0,7);ctx.fill();ctx.strokeStyle='#fff5a3';ctx.lineWidth=2*s;ctx.stroke()}else if(o.type==='barrier'){rect(-18*s,-29*s,36*s,29*s,'#c46c3b');rect(-18*s,-24*s,36*s,6*s,'#f5c66d');rect(-18*s,-12*s,36*s,5*s,'#343c44');rect(-21*s,-3*s,42*s,5*s,'#232b33')}else if(o.type==='beam'){rect(-24*s,-75*s,8*s,75*s,'#536575');rect(16*s,-75*s,8*s,75*s,'#536575');rect(-26*s,-75*s,52*s,14*s,'#d38d4a');for(let i=0;i<4;i++)rect((-22+i*12)*s,-73*s,6*s,10*s,'#2c3238')}else{rect(-20*s,-36*s,40*s,36*s,'#677782');rect(-20*s,-36*s,40*s,6*s,'#a0a7a4');rect(-16*s,-28*s,6*s,24*s,'#3e505b');rect(9*s,-28*s,6*s,24*s,'#3e505b')}ctx.restore()}function kairos(){let p=project(0,laneVisual-1),x=p.x,y=H*.80-jumpHeight(),s=clamp(W/380,.85,1.2),t=clock*speed*.8,run=Math.sin(t)*9*s;ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,8+jumpHeight()/s,29,8,0,0,7);ctx.fill();if(slide>0){ctx.rotate(-.6);ctx.translate(0,12)}line(-8,-7,-12+run,29,'#222c37',11);line(8,-7,12-run,29,'#222c37',11);line(-12+run,29,-16+run,32,'#c8d2d8',8);line(12-run,29,17-run,32,'#c8d2d8',8);rect(-18,-72,36,65,'#131b24');poly([[-18,-72],[0,-78],[18,-72],[15,-12],[-15,-12]],'#1c2730');rect(-12,-65,24,35,'#202e38');rect(-15,-69,30,7,'#3b4b56');line(-19,-62,-25-run*.6,-28,'#202b36',12);line(19,-62,25+run*.6,-28,'#202b36',12);rect(-10,-89,20,19,'#674533');ctx.fillStyle='#17171c';ctx.beginPath();ctx.ellipse(0,-96,17,15,0,0,7);ctx.fill();for(let i=0;i<11;i++){let a=i*2.4;ctx.beginPath();ctx.arc(Math.sin(a)*14,-101+Math.cos(a)*9,5,0,7);ctx.fill()}rect(-12,-57,24,25,'#27333e');rect(-9,-52,18,18,'#161d25');ctx.restore()}function jumpHeight(){return jump>0?Math.sin((1-jump/.84)*Math.PI)*H*.14:0}function hit(){shake=.28;playing=false;dead=true;menu.style.display='flex';controls.style.display='none';pauseBtn.style.display='none';desc.innerHTML='RUN ENDED<br>Score: '+score.toLocaleString()+' · Coins: '+coins+'<br>Reached: '+names[zone];start.textContent='TRY AGAIN'}function update(dt){clock+=dt;speed=Math.min(31,15+dist/250);dist+=speed*dt;score=Math.floor(dist*12)+coins*50;zone=Math.min(4,Math.floor(dist/220));roadOffset=(roadOffset+speed*dt)%85;laneVisual+=(lane-laneVisual)*Math.min(1,dt*12);if(jump>0)jump=Math.max(0,jump-dt);if(slide>0)slide=Math.max(0,slide-dt);spawn-=dt;if(spawn<=0){let kind=rnd(dist*1.23),type=kind<.24?'coin':kind<.54?'barrier':kind<.78?'crate':'beam';obstacles.push({z:85,lane:Math.floor(rnd(dist*4.3)*3),type,passed:false});spawn=Math.max(.46,1.35-dist/1250)*(type==='coin'?.75:1)}for(let o of obstacles){o.z-=speed*dt;if(!o.passed&&o.z<4){o.passed=true;if(o.lane===lane){if(o.type==='coin')coins++;else if(o.type==='beam'?slide<=0:jump<=0)hit()}}}obstacles=obstacles.filter(o=>o.z>-8);shake=Math.max(0,shake-dt)}function hud(){ctx.fillStyle='#061421aa';ctx.fillRect(0,0,W,78);ctx.fillStyle='#eaf7ff';ctx.font='bold 15px system-ui';ctx.textAlign='left';ctx.fillText('NEON DASH',14,27);ctx.font='12px system-ui';ctx.fillStyle='#89dcff';ctx.fillText(names[zone],14,47);ctx.fillStyle='#fff';ctx.textAlign='right';ctx.font='bold 16px system-ui';ctx.fillText(score.toLocaleString(),W-58,27);ctx.font='12px system-ui';ctx.fillStyle='#ffdc7d';ctx.fillText('◉ '+coins,W-58,48);let progress=dist%220/220;rect(14,65,W-28,3,'#ffffff30');rect(14,65,(W-28)*progress,3,'#29d9ff')}function frame(ts){let dt=last?Math.min((ts-last)/1000,.05):0;last=ts;ctx.save();if(playing&&!paused)update(dt);if(shake>0)ctx.translate((Math.random()-.5)*shake*12,0);drawWorld();obstacles.sort((a,b)=>b.z-a.z).forEach(obstacle);kairos();hud();if(paused){rect(0,H*.4,W,H*.2,'#041320cc');ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillStyle='white';ctx.fillText('PAUSED',W/2,H*.5)}ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
